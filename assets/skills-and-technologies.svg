<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Skills and Technologies</title>
<desc id="desc">Simple animated technology logos grouped by cybersecurity, networking, Linux systems, IoT and programming.</desc>
<defs>
<style>
.logo{animation:float 4s ease-in-out infinite}
.d2{animation-delay:-1s}.d3{animation-delay:-2s}.d4{animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
</style>
</defs>
<rect width="1200" height="500" rx="18" fill="#0B1016"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#E7EEF5">Skills &amp; Technologies</text>

<text x="70" y="88" font-size="13" font-weight="700" fill="#2FD9E8">CYBERSECURITY</text>
<line x1="70" y1="99" x2="1130" y2="99" stroke="#24333E"/>

