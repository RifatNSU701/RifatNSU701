<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Skills and Technologies</title>
<desc id="desc">Animated cybersecurity, networking, Linux systems, IoT, programming skills and technologies dashboard.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050A10"/><stop offset=".5" stop-color="#08131D"/><stop offset="1" stop-color="#04080D"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#15313D" opacity=".34"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.pulse{animation:pulse 2.5s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.scan{animation:scan 7s linear infinite}.dash{animation:dash 10s linear infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes scan{0%{transform:translateX(-1500px);opacity:0}15%{opacity:.7}70%{opacity:.7}100%{transform:translateX(1500px);opacity:0}}@keyframes dash{to{stroke-dashoffset:-120}}
</style>
</defs>
