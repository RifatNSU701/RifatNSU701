<g class="logo d4"><circle cx="960" cy="310" r="30" fill="#10232A"/><rect x="938" y="290" width="44" height="38" rx="7" fill="none" stroke="#2F9BF4" stroke-width="3"/><text x="960" y="316" text-anchor="middle" font-size="19" font-weight="800" fill="#2F9BF4">›_</text><text x="960" y="358" text-anchor="middle" font-size="12" fill="#C9D5DF">SSH</text></g>
