<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-label="Cybersecurity technology animation">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="110" rx="16" fill="#0D1117" stroke="#273244"/>
  <path d="M40 78 H1160" stroke="#273244" stroke-width="1"/>
  <path d="M40 78 H1160" stroke="url(#g)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="160 1040">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <g fill="#22C55E" filter="url(#glow)">
    <circle cx="160" cy="78" r="3"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="78" r="3"><animate attributeName="r" values="3;6;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="78" r="3"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="42" text-anchor="middle" fill="#E5E7EB" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">SECURITY • NETWORK • INFRASTRUCTURE</text>
  <text x="600" y="63" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">CONTINUOUSLY BUILDING • MONITORING • LEARNING</text>
</svg>
