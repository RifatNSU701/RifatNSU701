<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="90">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#F43F5E;#38BDF8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#F43F5E;#38BDF8;#818CF8" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#F43F5E;#38BDF8;#818CF8;#F43F5E" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="btnClip">
      <rect x="10" y="10" width="780" height="70" rx="14" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 19px;
      font-weight: 800;
      fill: #F8FAFC;
      letter-spacing: 2.5px;
    }
    .subtitle {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 3px;
    }
    .arrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 900;
      fill: #38BDF8;
      animation: pulseArrow 1.2s infinite ease-in-out;
    }
    @keyframes pulseArrow {
      0%, 100% { transform: translateX(0px); opacity: 0.6; }
      50% { transform: translateX(6px); opacity: 1; }
    }
  </style>

  <!-- Outer Glowing Frame -->
  <rect x="10" y="10" width="780" height="70" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Sweeping Cyber Scanline -->
  <g clip-path="url(#btnClip)">
    <rect x="-250" y="10" width="220" height="70" fill="url(#scanGrad)" transform="skewX(-20)">
      <animate attributeName="x" from="-250" to="950" dur="3.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 22 18 L 38 18 M 22 18 L 22 30" stroke="#38BDF8" stroke-width="2" fill="none" />
  <path d="M 778 72 L 762 72 M 778 72 L 778 60" stroke="#38BDF8" stroke-width="2" fill="none" />

  <!-- Pulsing Live Beacon (Left) -->
  <circle cx="58" cy="45" r="6" fill="#10B981" />
  <circle cx="58" cy="45" r="6" fill="none" stroke="#10B981" stroke-width="2">
    <animate attributeName="r" from="6" to="18" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="1" to="0" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- Button Text -->
  <text x="400" y="42" text-anchor="middle" class="title">🚀 LAUNCH INTERACTIVE PORTFOLIO</text>
  <text x="400" y="64" text-anchor="middle" class="subtitle">[ HTTPS://WWW.RIFATKHAN.TECH ] — CLICK TO INITIALIZE</text>

  <!-- Animated Launch Arrows (Right) -->
  <g class="arrow">
    <text x="725" y="52">❯❯</text>
  </g>
</svg>
