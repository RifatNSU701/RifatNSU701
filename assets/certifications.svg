<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Certifications — Cybersecurity and Networking Credentials</title>
<desc id="desc">Premium animated certification cards showing completed credentials and CCNA in progress.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081018"/><stop offset=".55" stop-color="#0A121B"/><stop offset="1" stop-color="#060C12"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2FD9E8" stop-opacity="0"/><stop offset=".5" stop-color="#2FD9E8" stop-opacity=".9"/><stop offset="1" stop-color="#2FD9E8" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
<pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#17303B" opacity=".42"/></pattern>
<style>
.card{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite}.c2{animation-delay:-1.2s}.c3{animation-delay:-2.4s}.c4{animation-delay:-3.6s}.c5{animation-delay:-4.8s}.pulse{animation:pulse 2.8s ease-in-out infinite}.scan{animation:scan 5s linear infinite}.shine{animation:shine 3.8s ease-in-out infinite}.orbit{animation:orbit 8s linear infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes scan{0%{transform:translateX(-500px);opacity:0}12%{opacity:.8}60%{opacity:.8}100%{transform:translateX(1450px);opacity:0}}@keyframes shine{0%,55%{transform:translateX(-520px);opacity:0}65%{opacity:.7}100%{transform:translateX(900px);opacity:0}}@keyframes orbit{to{transform:rotate(360deg)}}
</style>
</defs>
<rect x="10" y="10" width="1180" height="740" rx="24" fill="url(#bg)" stroke="#243541"/>
<rect x="11" y="11" width="1178" height="738" rx="23" fill="url(#grid)" opacity=".36"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
