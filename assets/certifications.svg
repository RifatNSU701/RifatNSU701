<g class="card c5"><rect x="590" y="472" width="322" height="220" rx="20" fill="#0B151E" stroke="#FFB52E" stroke-opacity=".34"/><circle cx="632" cy="514" r="29" fill="#FFB52E" fill-opacity=".10" stroke="#FFB52E" stroke-opacity=".52"/><text x="632" y="521" text-anchor="middle" font-size="15" font-weight="800" fill="#FFB52E">CCNA</text><text x="680" y="504" font-size="12" letter-spacing="2" font-weight="700" fill="#718596">CREDENTIAL 05</text><text x="680" y="531" font-size="18" font-weight="700" fill="#F2F6FA">CCNA</text><g transform="translate(680 550)"><rect width="137" height="28" rx="14" fill="#1B160A" stroke="#73591B"/><circle cx="14" cy="14" r="4.5" fill="#FFCC67" class="pulse"/><text x="25" y="19" font-size="11" font-weight="800" letter-spacing="1" fill="#FFCC67">IN PROGRESS</text></g><text x="616" y="617" font-size="13" fill="#91A4B7">Current learning track</text><rect x="616" y="640" width="270" height="5" rx="2.5" fill="#2B2414"/><rect x="616" y="640" width="82" height="5" rx="2.5" fill="#FFB52E" opacity=".95"/><rect x="616" y="640" width="82" height="5" rx="2.5" fill="#FFFFFF" opacity=".30" class="shine"/><text x="616" y="670" font-size="11" fill="#617586">IN PROGRESS · NO COMPLETION DATE CLAIMED</text></g>
