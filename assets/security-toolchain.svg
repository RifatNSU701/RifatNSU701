<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Security Toolchain</title>
<desc id="desc">Simple animated security and infrastructure technology logos.</desc>
<defs><style>.logo{animation:float 4s ease-in-out infinite}.d2{animation-delay:-1s}.d3{animation-delay:-2s}.d4{animation-delay:-3s}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}</style></defs>
<rect width="1200" height="360" rx="18" fill="#0B1016"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
