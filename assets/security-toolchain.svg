<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Security Toolchain</title>
<desc id="desc">Animated cybersecurity and infrastructure toolchain telemetry.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081018"/><stop offset=".55" stop-color="#0A121B"/><stop offset="1" stop-color="#060C12"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop stop-color="#2FD9E8" stop-opacity="0"/><stop offset=".5" stop-color="#2FD9E8"/><stop offset="1" stop-color="#2FD9E8" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#17303B" opacity=".4"/></pattern>
<style>
.node{animation:node 4s ease-in-out infinite}.n2{animation-delay:-.6s}.n3{animation-delay:-1.2s}.n4{animation-delay:-1.8s}.n5{animation-delay:-2.4s}.n6{animation-delay:-3s}
.p{animation:p 2.4s ease-in-out infinite}.scan{animation:scan 4.5s linear infinite}
@keyframes node{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@keyframes scan{0%{transform:translateX(-500px);opacity:0}15%{opacity:.8}70%{opacity:.8}100%{transform:translateX(1600px);opacity:0}}
</style>
</defs>
<rect x="10" y="10" width="1180" height="340" rx="24" fill="url(#bg)" stroke="#243541"/>
<rect x="11" y="11" width="1178" height="338" rx="23" fill="url(#grid)" opacity=".32"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="54" y="64" font-size="30" font-weight="750" fill="#F2F6FA">Security <tspan fill="#2FD9E8">Toolchain</tspan></text>
<text x="54" y="94" font-size="16" fill="#91A4B7">Operational stack · security telemetry · network engineering · systems</text>
<g transform="translate(1010 45)"><rect width="132" height="34" rx="17" fill="#071D1A" stroke="#126D61"/><circle cx="18" cy="17" r="5" fill="#31E6B4" class="p"/><text x="31" y="22" font-size="12" font-weight="700" fill="#31E6B4">ACTIVE STACK</text></g>
<path d="M72 158H1128" stroke="#263642" stroke-dasharray="4 8"/>
<path d="M72 250H1128" stroke="#263642" stroke-dasharray="4 8"/>
<g fill="none" stroke="#2FD9E8" stroke-opacity=".22"><path d="M120 184H1080"/><path d="M120 276H1080"/></g>
<g class="node"><circle cx="120" cy="184" r="20" fill="#2FD9E8" fill-opacity=".08" stroke="#2FD9E8" stroke-opacity=".55"/><circle cx="120" cy="184" r="5" fill="#2FD9E8" filter="url(#glow)" class="p"/><text x="120" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#DCE6EE">SOC / SIEM</text></g>
<g class="node n2"><circle cx="300" cy="184" r="20" fill="#2F9BF4" fill-opacity=".08" stroke="#2F9BF4" stroke-opacity=".55"/><circle cx="300" cy="184" r="5" fill="#2F9BF4" filter="url(#glow)" class="p"/><text x="300" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#DCE6EE">SECURITY TESTING</text></g>
<g class="node n3"><circle cx="500" cy="184" r="20" fill="#8B68F5" fill-opacity=".08" stroke="#8B68F5" stroke-opacity=".55"/><circle cx="500" cy="184" r="5" fill="#8B68F5" filter="url(#glow)" class="p"/><text x="500" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#DCE6EE">NETWORK SECURITY</text></g>
<g class="node n4"><circle cx="700" cy="184" r="20" fill="#39C98A" fill-opacity=".08" stroke="#39C98A" stroke-opacity=".55"/><circle cx="700" cy="184" r="5" fill="#39C98A" filter="url(#glow)" class="p"/><text x="700" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#DCE6EE">NETWORKING</text></g>
<g class="node n5"><circle cx="900" cy="184" r="20" fill="#FFB52E" fill-opacity=".08" stroke="#FFB52E" stroke-opacity=".55"/><circle cx="900" cy="184" r="5" fill="#FFB52E" filter="url(#glow)" class="p"/><text x="900" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#DCE6EE">LINUX / SYSTEMS</text></g>
<g class="node n6"><circle cx="1080" cy="184" r="20" fill="#F06B78" fill-opacity=".08" stroke="#F06B78" stroke-opacity=".55"/><circle cx="1080" cy="184" r="5" fill="#F06B78" filter="url(#glow)" class="p"/><text x="1080" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#DCE6EE">IoT</text></g>
<g opacity=".55"><circle cx="120" cy="276" r="8" fill="#2FD9E8"/><circle cx="300" cy="276" r="8" fill="#2F9BF4"/><circle cx="500" cy="276" r="8" fill="#8B68F5"/><circle cx="700" cy="276" r="8" fill="#39C98A"/><circle cx="900" cy="276" r="8" fill="#FFB52E"/><circle cx="1080" cy="276" r="8" fill="#F06B78"/></g>
<text x="120" y="304" text-anchor="middle" font-size="11" fill="#718596">WAZUH · SPLUNK · ELASTIC</text>
<text x="300" y="304" text-anchor="middle" font-size="11" fill="#718596">NMAP · METASPLOIT · BURP</text>
<text x="500" y="304" text-anchor="middle" font-size="11" fill="#718596">PFSENSE · WIRESHARK</text>
<text x="700" y="304" text-anchor="middle" font-size="11" fill="#718596">CISCO · PACKET TRACER</text>
<text x="900" y="304" text-anchor="middle" font-size="11" fill="#718596">KALI · UBUNTU · BASH · SSH</text>
<text x="1080" y="304" text-anchor="middle" font-size="11" fill="#718596">MQTT · BLE</text>
<rect x="18" y="148" width="3" height="115" fill="#2FD9E8" opacity=".5" class="scan"/>
</g></svg>