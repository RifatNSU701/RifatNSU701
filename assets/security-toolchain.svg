<text x="600" y="62" text-anchor="middle" font-size="12" fill="#718C9E">Security monitoring · testing · network defense · systems</text>

<text x="55" y="96" font-size="12" font-weight="700" fill="#2FD9E8">SOC / SIEM</text>
