<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
  </defs>

  <style>
    .header { font: 700 20px 'Segoe UI', Ubuntu, Sans-Serif; fill: #F8FAFC; }
    .sub { font: 600 11px 'JetBrains Mono', monospace; fill: #38BDF8; letter-spacing: 1.5px; }
    .cat { font: 700 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #E2E8F0; }
    .meta { font: 600 12px 'JetBrains Mono', monospace; fill: #94A3B8; }
    .pct { font: 700 12px 'JetBrains Mono', monospace; fill: #38BDF8; }
    .track { fill: #1E293B; }
  </style>

  <!-- Main Card Container -->
  <rect x="2" y="2" width="896" height="336" rx="16" fill="url(#cardBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" class="header">Core Competency & Domain Telemetry Dashboard</text>
  <text x="450" y="58" text-anchor="middle" class="sub">REAL-TIME ARCHITECTURAL PROFICIENCY MATRIX</text>
  <line x1="40" y1="74" x2="860" y2="74" stroke="#1E293B" stroke-width="1.5" />

  <!-- LEFT COLUMN -->
  <!-- Skill 1 -->
  <text x="45" y="105" class="cat">🛡️ Cybersecurity Defense & SIEM Operations</text>
  <text x="425" y="105" text-anchor="end" class="pct">95%</text>
  <rect x="45" y="114" width="380" height="10" rx="5" class="track" />
  <rect x="45" y="114" width="361" height="10" rx="5" fill="url(#cyanGrad)">
    <animate attributeName="width" from="0" to="361" dur="1.2s" fill="freeze" />
  </rect>
  <text x="45" y="140" class="meta">Wazuh • Splunk • Elastic SIEM • Burp Suite • Nmap</text>

  <!-- Skill 2 -->
  <text x="45" y="180" class="cat">🌐 Network Security & Firewall Architecture</text>
  <text x="425" y="180" text-anchor="end" class="pct">92%</text>
  <rect x="45" y="189" width="380" height="10" rx="5" class="track" />
  <rect x="45" y="189" width="350" height="10" rx="5" fill="url(#indigoGrad)">
    <animate attributeName="width" from="0" to="350" dur="1.3s" fill="freeze" />
  </rect>
  <text x="45" y="215" class="meta">pfSense • Cisco Routing • Wireshark • Packet Tracer • OpenSSH</text>

  <!-- Skill 3 -->
  <text x="45" y="255" class="cat">🐧 Linux Systems & Kernel Hardening</text>
  <text x="425" y="255" text-anchor="end" class="pct">94%</text>
  <rect x="45" y="264" width="380" height="10" rx="5" class="track" />
  <rect x="45" y="264" width="357" height="10" rx="5" fill="url(#emeraldGrad)">
    <animate attributeName="width" from="0" to="357" dur="1.4s" fill="freeze" />
  </rect>
  <text x="45" y="290" class="meta">Kali Linux • Ubuntu Server • Bash Automation • Custom ROM/AOSP</text>

  <!-- Divider -->
  <line x1="450" y1="90" x2="450" y2="310" stroke="#1E293B" stroke-width="1.5" />

  <!-- RIGHT COLUMN -->
  <!-- Skill 4 -->
  <text x="475" y="105" class="cat">💻 Systems & Backend Engineering</text>
  <text x="855" y="105" text-anchor="end" class="pct">93%</text>
  <rect x="475" y="114" width="380" height="10" rx="5" class="track" />
  <rect x="475" y="114" width="353" height="10" rx="5" fill="url(#cyanGrad)">
    <animate attributeName="width" from="0" to="353" dur="1.2s" fill="freeze" />
  </rect>
  <text x="475" y="140" class="meta">Python • Rust • C / C++ • Java • Data Structures & Algorithms</text>

  <!-- Skill 5 -->
  <text x="475" y="180" class="cat">📱 Full-Stack Web & Cross-Platform Mobile</text>
  <text x="855" y="180" text-anchor="end" class="pct">90%</text>
  <rect x="475" y="189" width="380" height="10" rx="5" class="track" />
  <rect x="475" y="189" width="342" height="10" rx="5" fill="url(#roseGrad)">
    <animate attributeName="width" from="0" to="342" dur="1.3s" fill="freeze" />
  </rect>
  <text x="475" y="215" class="meta">Flutter • Dart • TypeScript • React • Next.js • TailwindCSS</text>

  <!-- Skill 6 -->
  <text x="475" y="255" class="cat">📊 Data Analytics, Relational DBs & Cloud CI/CD</text>
  <text x="855" y="255" text-anchor="end" class="pct">91%</text>
  <rect x="475" y="264" width="380" height="10" rx="5" class="track" />
  <rect x="475" y="264" width="346" height="10" rx="5" fill="url(#indigoGrad)">
    <animate attributeName="width" from="0" to="346" dur="1.4s" fill="freeze" />
  </rect>
  <text x="475" y="290" class="meta">SQL • PostgreSQL • MySQL • Docker • GitHub Actions • Vercel</text>
</svg>
