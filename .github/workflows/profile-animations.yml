name: Generate Profile Animations (Snake & 3D Graph)

on:
  # Runs automatically every 12 hours (6:00 AM and 6:00 PM BDT)
  schedule:
    - cron: "0 */12 * * *"

  # Allows manual one-click execution from the Actions tab
  workflow_dispatch:

  # Runs automatically when you update your README on main/master
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  # ===================================================================
  # JOB 1: Generate Animated Contribution Snake -> 'output' branch
  # ===================================================================
  generate-snake:
    name: 🐍 Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVGs (Light & TokyoNight Dark)
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f43f5e&color_dots=#0f172a,#0369a1,#0284c7,#38bdf8,#7dd3fc

      - name: Deploy Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===================================================================
  # JOB 2: Generate 3D Isometric Contribution City -> 'main' branch
  # ===================================================================
  generate-3d-contrib:
    name: 🧊 Generate 3D Isometric Graph
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push 3D SVGs to Default Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git diff --staged --quiet || (git commit -m "chore: update 3D contribution graph" && git push)
