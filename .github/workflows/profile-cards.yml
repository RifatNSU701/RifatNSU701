name: Generate profile analytics

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-cards.yml'
      - 'scripts/generate_projects.py'

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate dynamic project cards
        run: python scripts/generate_projects.py

      - name: Render profile analytics cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: RifatNSU701
          cards: overview,contributions,languages,rhythm
          output-dir: assets/profile
          themes: dark
          commit: false

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile assets/projects
          if git diff --cached --quiet; then
            echo "No profile asset changes."
          else
            git commit -m "chore(profile): refresh live analytics and projects [skip ci]"
            git push
          fi
