name: Generate profile analytics

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/profile-cards.yml'
      - 'scripts/generate_projects.py'
      - 'scripts/generate_profile.py'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate dynamic project cards
        run: python scripts/generate_projects.py

      - name: Generate premium live profile analytics
        run: python scripts/generate_profile.py

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile assets/projects
          if git diff --cached --quiet; then
            echo "No profile asset changes."
          else
            git commit -m "chore(profile): refresh live analytics and projects [skip ci]"
            git push
          fi
