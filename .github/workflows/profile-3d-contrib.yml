name: Generate 3D Isometric Contribution Graph

on:
  # Runs automatically every day at 18:00 UTC (Midnight BDT)
  schedule:
    - cron: "0 18 * * *"

  # Allows manual trigger anytime from the Actions tab
  workflow_dispatch:

  # Runs when you push changes to main
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push 3D SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || (git commit -m "chore: update 3D contribution graph" && git push)
